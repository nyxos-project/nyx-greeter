# /etc/nyx-greeter/config.toml (NyxOS writes it). Every key is optional.

# A Nyx theme id; the login theme is a system setting, not a user's.
theme = "nyx-dark"

# The picture behind the card, and how much to darken it (0 to 1). Without one, the
# theme's background colour.
# wallpaper = "/usr/share/backgrounds/nyx/nyx-dark/monochrome/nyx_monochrome_02_4K.jpg"
dim = 0.55

# The mark above the card (a PNG or SVG).
# mark = "/usr/share/nyx-greeter/mark.png"

# Offer the other users (the last one is always preselected).
user_list = true
power = true
clock = true

# The session for users who haven't picked one: a desktop file name.
# default_session = "hyprland-uwsm"

# Extra folders of .desktop sessions, besides the system's wayland-sessions.
# session_dirs = []
