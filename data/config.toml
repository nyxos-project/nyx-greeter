# /etc/nyx-greeter/config.toml (NyxOS writes it). Every key is optional.

# A Nyx theme id; the login theme is a system setting, not a user's.
theme = "nyx-dark"

# The picture behind the clock and card, and how much to darken it (0 to 1). Without
# one, the theme's background colour. NyxOS gives it the lock screen's (N, Y and X
# stacked on the right).
# wallpaper = "/usr/share/backgrounds/nyx/catppuccin-mocha/wordmark/nyx_wordmark_lock_4K.png"
dim = 0

# The sign-in animation while a fingerprint, face or security key is checked:
# circular, cyberpunk, minimal or edge.
style = "circular"

# Offer the other users (the last one is always preselected).
user_list = true
power = true
clock = true

# The session for users who haven't picked one: a desktop file name.
# default_session = "hyprland-uwsm"

# Extra folders of .desktop sessions, besides the system's wayland-sessions.
# session_dirs = []
