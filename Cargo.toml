[workspace]
resolver = "3"
members = ["crates/nyx-greetd", "crates/nyx-greeter-core", "crates/nyx-signin-ui", "crates/nyx-lock-core", "apps/greeter", "apps/locker", "apps/prompt"]

[workspace.package]
edition = "2024"
license = "MIT"
authors = ["Ken Smith"]
repository = "https://github.com/nyxos-project/nyx-greeter"

[workspace.dependencies]
async-channel = "2"
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
gtk4-layer-shell = "0.8"
gtk4-session-lock = { version = "0.4.1", features = ["v1_2"] }
nyx-theme = { git = "https://github.com/design-nexus/nyx-design.git", rev = "4f8e16d6ae3dbc2a14091271e3b6bb29902c0df4" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[profile.release]
lto = "thin"
strip = true
